name: Windows package verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build small unsigned web installer
        run: npm run dist:win:web:unsigned
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify the web installer and payload stay unsigned and complete
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath release-final -Filter 'Alora-Desktop-Setup-*-x64.exe' -File -Recurse | Select-Object -First 1
          if (-not $installer) { throw 'Electron Builder did not produce the expected web installer.' }
          if ($installer.Length -gt 10MB) { throw "The downloadable web installer is too large ($($installer.Length) bytes)." }
          $payload = Get-ChildItem -LiteralPath release-final -Filter '*.nsis.7z' -File -Recurse | Select-Object -First 1
          if (-not $payload -or $payload.Length -lt 1MB) { throw 'Electron Builder did not produce the application package.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne 'NotSigned') { throw 'The verification package must remain unsigned.' }
          Write-Host "Built $($installer.Name) ($($installer.Length) bytes) and $($payload.Name) ($($payload.Length) bytes). This CI job does not publish them."
